version: '3.8'

services:
  # Main Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: commhourtrac-app
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      # Email Configuration
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - SMTP_FROM=${SMTP_FROM:-noreply@commhourtrac.org}
      - SMTP_SECURE=${SMTP_SECURE:-false}
      # Rate Limiting
      - RATE_LIMIT_WINDOW_MS=${RATE_LIMIT_WINDOW_MS:-900000}
      - RATE_LIMIT_MAX=${RATE_LIMIT_MAX:-50}
      # CORS
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:3000}
    volumes:
      # Persist logs
      - app-logs:/app/logs
      # Persist uploads (if needed)
      - app-uploads:/app/uploads
    networks:
      - commhourtrac-network
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/api/email/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Redis for caching and sessions
  redis:
    image: redis:7-alpine
    container_name: commhourtrac-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-commhourtrac_redis_password}
    volumes:
      - redis-data:/data
    networks:
      - commhourtrac-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-commhourtrac_redis_password}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # Nginx reverse proxy (optional, for production with SSL)
  nginx:
    image: nginx:alpine
    container_name: commhourtrac-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx-logs:/var/log/nginx
    depends_on:
      - app
    networks:
      - commhourtrac-network
    profiles:
      - production

  # MailHog for email testing (development only)
  mailhog:
    image: mailhog/mailhog:latest
    container_name: commhourtrac-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"  # SMTP server
      - "8025:8025"  # Web UI
    networks:
      - commhourtrac-network
    profiles:
      - development

  # Postal for production email server (self-hosted)
  postal:
    image: postal/postal:latest
    container_name: commhourtrac-postal
    restart: unless-stopped
    environment:
      - POSTAL_DB_HOST=postal-db
      - POSTAL_DB_USERNAME=postal
      - POSTAL_DB_PASSWORD=${POSTAL_DB_PASSWORD:-postal_password}
      - POSTAL_DB_DATABASE=postal
      - POSTAL_RABBITMQ_HOST=postal-rabbitmq
      - POSTAL_RABBITMQ_USERNAME=postal
      - POSTAL_RABBITMQ_PASSWORD=${POSTAL_RABBITMQ_PASSWORD:-postal_rabbitmq_password}
      - POSTAL_SMTP_SERVER_HOSTNAME=${POSTAL_SMTP_HOSTNAME:-mail.commhourtrac.org}
    volumes:
      - postal-data:/opt/postal/data
    networks:
      - commhourtrac-network
    depends_on:
      - postal-db
      - postal-rabbitmq
    profiles:
      - postal

  postal-db:
    image: mariadb:10.6
    container_name: commhourtrac-postal-db
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${POSTAL_DB_ROOT_PASSWORD:-root_password}
      - MYSQL_DATABASE=postal
      - MYSQL_USER=postal
      - MYSQL_PASSWORD=${POSTAL_DB_PASSWORD:-postal_password}
    volumes:
      - postal-db-data:/var/lib/mysql
    networks:
      - commhourtrac-network
    profiles:
      - postal

  postal-rabbitmq:
    image: rabbitmq:3-alpine
    container_name: commhourtrac-postal-rabbitmq
    restart: unless-stopped
    environment:
      - RABBITMQ_DEFAULT_USER=postal
      - RABBITMQ_DEFAULT_PASS=${POSTAL_RABBITMQ_PASSWORD:-postal_rabbitmq_password}
    volumes:
      - postal-rabbitmq-data:/var/lib/rabbitmq
    networks:
      - commhourtrac-network
    profiles:
      - postal

networks:
  commhourtrac-network:
    driver: bridge

volumes:
  app-logs:
    driver: local
  app-uploads:
    driver: local
  redis-data:
    driver: local
  nginx-logs:
    driver: local
  postal-data:
    driver: local
  postal-db-data:
    driver: local
  postal-rabbitmq-data:
    driver: local
